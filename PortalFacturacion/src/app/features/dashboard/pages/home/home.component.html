<div class="dashboard-container">
    <h1>Bienvenido al Portal de Facturación</h1>
    <p>Seleccione una opción del menú para comenzar.</p>

    <div class="cards-grid">
        <mat-card class="dashboard-card" routerLink="/facturas">
            <mat-card-header>
                <mat-icon mat-card-avatar>receipt</mat-icon>
                <mat-card-title>Facturas</mat-card-title>
                <mat-card-subtitle>Gestionar Facturas</mat-card-subtitle>
            </mat-card-header>
        </mat-card>

        <mat-card class="dashboard-card" routerLink="/clientes">
            <mat-card-header>
                <mat-icon mat-card-avatar>people</mat-icon>
                <mat-card-title>Clientes</mat-card-title>
                <mat-card-subtitle>Gestionar Clientes</mat-card-subtitle>
            </mat-card-header>
        </mat-card>

        <mat-card class="dashboard-card" routerLink="/productos">
            <mat-card-header>
                <mat-icon mat-card-avatar>inventory_2</mat-icon>
                <mat-card-title>Productos</mat-card-title>
                <mat-card-subtitle>Gestionar Productos</mat-card-subtitle>
            </mat-card-header>
        </mat-card>
    </div>
</div>
