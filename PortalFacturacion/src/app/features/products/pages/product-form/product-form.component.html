<div class="container-fluid page-container">
    <div class="header-row">
        <h1>{{ esEdicion ? 'Editar' : 'Crear' }} Producto</h1>
        <button mat-button routerLink="/productos">
            <mat-icon>arrow_back</mat-icon> Volver
        </button>
    </div>

    <mat-card>
        <mat-card-content>
            <form [formGroup]="form" (ngSubmit)="guardar()">
                <div class="form-grid">
                    <mat-form-field appearance="outline" *ngIf="!esEdicion">
                        <mat-label>Codigo</mat-label>
                        <input matInput formControlName="codigo" placeholder="Codigo del producto">
                        <mat-error *ngIf="form.get('codigo')?.hasError('required')">Requerido</mat-error>
                    </mat-form-field>

                    <mat-form-field appearance="outline">
                        <mat-label>Nombre</mat-label>
                        <input matInput formControlName="nombre" placeholder="Nombre del producto">
                        <mat-error *ngIf="form.get('nombre')?.hasError('required')">Requerido</mat-error>
                    </mat-form-field>

                    <mat-form-field appearance="outline">
                        <mat-label>Precio Unitario</mat-label>
                        <input matInput type="number" formControlName="precioUnitario" placeholder="0.00" step="0.01">
                        <mat-error *ngIf="form.get('precioUnitario')?.hasError('required')">Requerido</mat-error>
                        <mat-error *ngIf="form.get('precioUnitario')?.hasError('min')">Debe ser mayor a 0</mat-error>
                    </mat-form-field>

                    <mat-form-field appearance="outline">
                        <mat-label>Stock</mat-label>
                        <input matInput type="number" formControlName="stock" placeholder="0">
                        <mat-error *ngIf="form.get('stock')?.hasError('required')">Requerido</mat-error>
                        <mat-error *ngIf="form.get('stock')?.hasError('min')">No puede ser negativo</mat-error>
                    </mat-form-field>

                    <mat-checkbox formControlName="activo" class="activo-checkbox" *ngIf="esEdicion">
                        Producto Activo
                    </mat-checkbox>
                </div>

                <div class="actions-row">
                    <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || cargando">
                        {{ esEdicion ? 'Actualizar' : 'Guardar' }}
                    </button>
                </div>
            </form>
        </mat-card-content>
    </mat-card>
</div>
