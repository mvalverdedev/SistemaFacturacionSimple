<div class="container-fluid page-container">
    <div class="header-row">
        <h1>{{ esEdicion ? 'Editar' : 'Crear' }} Usuario</h1>
        <button mat-button routerLink="/usuarios">
            <mat-icon>arrow_back</mat-icon> Volver
        </button>
    </div>

    <mat-card>
        <mat-card-content>
            <form [formGroup]="form" (ngSubmit)="guardar()">
                <div class="form-grid">
                    <mat-form-field appearance="outline" *ngIf="!esEdicion">
                        <mat-label>Usuario (Login)</mat-label>
                        <input matInput formControlName="nombreUsuario" placeholder="Nombre de usuario">
                        <mat-error *ngIf="form.get('nombreUsuario')?.hasError('required')">Requerido</mat-error>
                    </mat-form-field>

                    <mat-form-field appearance="outline">
                        <mat-label>Nombre Completo</mat-label>
                        <input matInput formControlName="nombreCompleto" placeholder="Nombre completo">
                        <mat-error *ngIf="form.get('nombreCompleto')?.hasError('required')">Requerido</mat-error>
                    </mat-form-field>

                    <mat-form-field appearance="outline">
                        <mat-label>Contraseña</mat-label>
                        <input matInput type="password" formControlName="clave" placeholder="Contraseña">
                        <mat-error *ngIf="form.get('clave')?.hasError('required')">Requerido</mat-error>
                        <mat-hint *ngIf="esEdicion">Dejar en blanco para no cambiar</mat-hint>
                    </mat-form-field>

                    <mat-form-field appearance="outline">
                        <mat-label>Rol</mat-label>
                        <mat-select formControlName="rol">
                            <mat-option value="Admin">Administrador</mat-option>
                            <mat-option value="Vendedor">Vendedor</mat-option>
                        </mat-select>
                        <mat-error *ngIf="form.get('rol')?.hasError('required')">Requerido</mat-error>
                    </mat-form-field>

                    <mat-checkbox formControlName="activo" class="activo-checkbox" *ngIf="esEdicion">
                        Usuario Activo
                    </mat-checkbox>
                </div>

                <div class="actions-row">
                    <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || cargando">
                        {{ esEdicion ? 'Actualizar' : 'Guardar' }}
                    </button>
                </div>
            </form>
        </mat-card-content>
    </mat-card>
</div>
