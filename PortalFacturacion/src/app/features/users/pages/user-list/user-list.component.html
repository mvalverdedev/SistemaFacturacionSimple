<div class="container-fluid page-container">
    <app-general-filter (search)="onSearch()">
        <form [formGroup]="searchForm" (ngSubmit)="onSearch()">
            <div class="grid grid-cols-1 gap-4">
                <div>
                    <mat-form-field class="w-full">
                        <mat-label>Usuario</mat-label>
                        <input matInput formControlName="nombreUsuario" placeholder="Ingrese usuario">
                    </mat-form-field>
                </div>
                <div>
                    <mat-form-field class="w-full">
                        <mat-label>Nombre Completo</mat-label>
                        <input matInput formControlName="nombreCompleto" placeholder="Ingrese nombre completo">
                    </mat-form-field>
                </div>
            </div>
        </form>
    </app-general-filter>
    <div class="header-row">
        <h1>Usuarios</h1>
        <button mat-raised-button color="primary" routerLink="crear">
            <mat-icon>add</mat-icon> Nuevo Usuario
        </button>
    </div>

    <mat-card>
        <mat-card-content>
            <div class="table-container">
                <table mat-table [dataSource]="dataSource" matSort class="full-width-table">


                    <ng-container matColumnDef="nombreUsuario">
                        <th mat-header-cell *matHeaderCellDef> Usuario </th>
                        <td mat-cell *matCellDef="let element"> {{element.nombreUsuario}} </td>
                    </ng-container>


                    <ng-container matColumnDef="nombreCompleto">
                        <th mat-header-cell *matHeaderCellDef> Nombre </th>
                        <td mat-cell *matCellDef="let element"> {{element.nombreCompleto}} </td>
                    </ng-container>


                    <ng-container matColumnDef="rol">
                        <th mat-header-cell *matHeaderCellDef> Rol </th>
                        <td mat-cell *matCellDef="let element"> {{element.rol}} </td>
                    </ng-container>


                    <ng-container matColumnDef="acciones">
                        <th mat-header-cell *matHeaderCellDef> </th>
                        <td mat-cell *matCellDef="let element">
                            <button mat-icon-button color="primary" (click)="editarUsuario(element)"
                                matTooltip="Editar">
                                <mat-icon>edit</mat-icon>
                            </button>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                </table>
            </div>

            <mat-paginator [length]="totalRecords" [pageSize]="pageSize" [pageSizeOptions]="[5, 10, 25, 100]"
                (page)="cambiarPagina($event)" showFirstLastButtons>
            </mat-paginator>
        </mat-card-content>
    </mat-card>
</div>
