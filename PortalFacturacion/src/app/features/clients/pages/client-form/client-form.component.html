<div class="container-fluid page-container">
    <div class="header-row">
        <h1>{{ esEdicion ? 'Editar' : 'Crear' }} Cliente</h1>
        <button mat-button routerLink="/clientes">
            <mat-icon>arrow_back</mat-icon> Volver
        </button>
    </div>

    <mat-card>
        <mat-card-content>
            <form [formGroup]="form" (ngSubmit)="guardar()">
                <div class="form-grid">
                    <mat-form-field appearance="outline" *ngIf="!esEdicion">
                        <mat-label>Identificacion</mat-label>
                        <input matInput formControlName="identificacion" placeholder="Cedula o RUC">
                        <mat-error *ngIf="form.get('identificacion')?.hasError('required')">Requerido</mat-error>
                    </mat-form-field>

                    <mat-form-field appearance="outline">
                        <mat-label>Razon Social</mat-label>
                        <input matInput formControlName="nombreRazonSocial" placeholder="Razon Social">
                        <mat-error *ngIf="form.get('nombreRazonSocial')?.hasError('required')">Requerido</mat-error>
                    </mat-form-field>

                    <mat-form-field appearance="outline">
                        <mat-label>Teléfono</mat-label>
                        <input matInput formControlName="telefono" placeholder="Teléfono">
                    </mat-form-field>

                    <mat-form-field appearance="outline">
                        <mat-label>Correo Electrónico</mat-label>
                        <input matInput formControlName="correo" placeholder="ejemplo@correo.com">
                        <mat-error *ngIf="form.get('correo')?.hasError('email')">Correo inválido</mat-error>
                    </mat-form-field>

                    <mat-form-field appearance="outline">
                        <mat-label>Direccion</mat-label>
                        <input matInput formControlName="direccion" placeholder="Direccion">
                    </mat-form-field>

                    <mat-checkbox formControlName="activo" class="activo-checkbox" *ngIf="esEdicion">
                        Cliente Activo
                    </mat-checkbox>
                </div>

                <div class="actions-row">
                    <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || cargando">
                        {{ esEdicion ? 'Actualizar' : 'Guardar' }}
                    </button>
                </div>
            </form>
        </mat-card-content>
    </mat-card>
</div>
