<div class="container-fluid page-container">
    <app-general-filter (search)="onSearch()">
        <form [formGroup]="searchForm" (ngSubmit)="onSearch()">
            <div class="grid grid-cols-1 gap-4">
                <div>
                    <mat-form-field class="w-full">
                        <mat-label>Identificación</mat-label>
                        <input matInput formControlName="identificacion" placeholder="Ingrese identificación">
                    </mat-form-field>
                </div>
                <div>
                    <mat-form-field class="w-full">
                        <mat-label>Nombre / Razón Social</mat-label>
                        <input matInput formControlName="nombreRazonSocial" placeholder="Ingrese nombre">
                    </mat-form-field>
                </div>
            </div>
        </form>
    </app-general-filter>
    <div class="header-row">
        <h1>Clientes</h1>
        <button mat-raised-button color="primary" routerLink="crear">
            <mat-icon>add</mat-icon> Nuevo Cliente
        </button>
    </div>

    <mat-card>
        <mat-card-content>
            <div class="table-container">
                <table mat-table [dataSource]="dataSource" matSort class="full-width-table">


                    <ng-container matColumnDef="identificacion">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> Identificación </th>
                        <td mat-cell *matCellDef="let element"> {{element.identificacion}} </td>
                    </ng-container>


                    <ng-container matColumnDef="nombre">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> Nombre </th>
                        <td mat-cell *matCellDef="let element"> {{element.nombreRazonSocial}} </td>
                    </ng-container>


                    <ng-container matColumnDef="telefono">
                        <th mat-header-cell *matHeaderCellDef> Teléfono </th>
                        <td mat-cell *matCellDef="let element"> {{element.telefono}} </td>
                    </ng-container>


                    <ng-container matColumnDef="correo">
                        <th mat-header-cell *matHeaderCellDef> Correo </th>
                        <td mat-cell *matCellDef="let element"> {{element.correo}} </td>
                    </ng-container>


                    <ng-container matColumnDef="acciones">
                        <th mat-header-cell *matHeaderCellDef> </th>
                        <td mat-cell *matCellDef="let element">
                            <button mat-icon-button color="primary" (click)="editarCliente(element)"
                                matTooltip="Editar">
                                <mat-icon>edit</mat-icon>
                            </button>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                </table>
            </div>

            <mat-paginator [length]="totalRecords" [pageSize]="pageSize" [pageSizeOptions]="[5, 10, 25, 100]"
                (page)="cambiarPagina($event)" showFirstLastButtons>
            </mat-paginator>
        </mat-card-content>
    </mat-card>
</div>
