<div class="container-fluid page-container">
    <div class="header-row">
        <h1>Facturas</h1>
        <button mat-raised-button color="primary" routerLink="crear">
            <mat-icon>add</mat-icon> Nueva Factura
        </button>
    </div>

    <mat-card>
        <mat-card-content>
            <div class="table-container">
                <table mat-table [dataSource]="dataSource" matSort class="full-width-table">

                    <!-- Numero Factura Column -->
                    <ng-container matColumnDef="numeroFactura">
                        <th mat-header-cell *matHeaderCellDef> Número </th>
                        <td mat-cell *matCellDef="let element"> {{element.numeroFactura}} </td>
                    </ng-container>

                    <!-- Fecha Creacion Column -->
                    <ng-container matColumnDef="fechaCreacion">
                        <th mat-header-cell *matHeaderCellDef> Fecha </th>
                        <td mat-cell *matCellDef="let element"> {{element.fechaCreacion | date:'short'}} </td>
                    </ng-container>

                    <!-- Nombre Cliente Column -->
                    <ng-container matColumnDef="nombreCliente">
                        <th mat-header-cell *matHeaderCellDef> Cliente </th>
                        <td mat-cell *matCellDef="let element"> {{element.nombreCliente}} </td>
                    </ng-container>

                    <!-- Nombre Vendedor Column -->
                    <ng-container matColumnDef="nombreVendedor">
                        <th mat-header-cell *matHeaderCellDef> Vendedor </th>
                        <td mat-cell *matCellDef="let element"> {{element.nombreVendedor}} </td>
                    </ng-container>

                    <!-- Total Column -->
                    <ng-container matColumnDef="total">
                        <th mat-header-cell *matHeaderCellDef> Total </th>
                        <td mat-cell *matCellDef="let element"> {{element.total | currency}} </td>
                    </ng-container>

                    <!-- Acciones Column -->
                    <ng-container matColumnDef="acciones">
                        <th mat-header-cell *matHeaderCellDef> </th>
                        <td mat-cell *matCellDef="let element">
                            <!-- Solo visualizar por ahora -->
                            <button mat-icon-button color="primary" [routerLink]="['ver', element.id]"
                                matTooltip="Ver Detalle">
                                <mat-icon>visibility</mat-icon>
                            </button>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                </table>
            </div>

            <mat-paginator [length]="totalRecords" [pageSize]="pageSize" [pageSizeOptions]="[5, 10, 25, 100]"
                (page)="cambiarPagina($event)" showFirstLastButtons>
            </mat-paginator>
        </mat-card-content>
    </mat-card>
</div>
