<div class="login-container">
    <mat-card class="login-card">
        <mat-card-header>
            <mat-card-title>Inicio de Sesión</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <form [formGroup]="loginForm" (ngSubmit)="ingresar()">
                <p>
                    <mat-form-field appearance="outline" class="full-width">
                        <mat-label>Usuario</mat-label>
                        <input matInput placeholder="Usuario" formControlName="usuario">
                        <mat-error *ngIf="loginForm.get('usuario')?.hasError('required')">
                            El usuario es requerido
                        </mat-error>
                    </mat-form-field>
                </p>
                <p>
                    <mat-form-field appearance="outline" class="full-width">
                        <mat-label>Contraseña</mat-label>
                        <input matInput type="password" placeholder="Contraseña" formControlName="contrasenia">
                        <mat-error *ngIf="loginForm.get('contrasenia')?.hasError('required')">
                            La contraseña es requerida
                        </mat-error>
                    </mat-form-field>
                </p>

                <div class="button-row">
                    <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid || cargando">
                        Ingresar
                    </button>
                </div>
            </form>
        </mat-card-content>
    </mat-card>
</div>
